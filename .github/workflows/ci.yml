name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration CMake
        run: cmake -B build -S .

      - name: Compilation
        run: cmake --build build

      - name: Exécution rapide (sanity check)
        run: ./build/task_manager